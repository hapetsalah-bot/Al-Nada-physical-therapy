<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-ar="حجز موعد | الندى" data-en="Reserve | Al-Nada">حجز موعد | الندى</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.jpeg" alt="Al-Nada Logo" class="logo-img">
                <span data-ar="الندى للعلاج الطبيعي والتأهيل" data-en="Al-Nada Physical Therapy">الندى للعلاج الطبيعي والتأهيل</span>
            </a>
            <nav class="nav-links">
                <a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
                <a href="services.html" data-ar="خدمات العيادة" data-en="Clinic Services">خدمات العيادة</a>
                <a href="booking.html" class="active" data-ar="حجز موعد" data-en="Reserve">حجز موعد</a>
                <a href="contact.html" data-ar="تواصل معنا" data-en="Visit Us">تواصل معنا</a>
            </nav>
            <button id="langToggle" class="lang-btn">English</button>
        </div>
    </header>

    <main class="page-container">
        <div class="page-header animate-up">
            <h1>
                <span data-ar="احجز موعد" data-en="Reserve Your">احجز موعد</span>
                <strong class="accent-text" data-ar="استشارتك" data-en="Appointment">استشارتك</strong>
            </h1>
        </div>

        <div class="booking-wrapper animate-up">
            <form id="bookingForm" class="booking-form">
                <div class="form-group">
                    <label data-ar="الاسم بالكامل *" data-en="Full Name *">الاسم بالكامل *</label>
                    <input type="text" id="fullName" required placeholder="أدخل اسمك الكامل">
                </div>
                
                <div class="form-group">
                    <label data-ar="رقم الهاتف *" data-en="Phone Number *">رقم الهاتف *</label>
                    <input type="tel" id="phone" required placeholder="01012345678">
                </div>
                
                <div class="form-group">
                    <label data-ar="نوع العلاج المطلوب *" data-en="Required Treatment *">نوع العلاج المطلوب *</label>
                    <select id="treatment" required>
                        <option value="pelvic" data-ar="تأهيل الحوض (للسيدات والأطفال فقط)" data-en="Pelvic Floor Rehab (Women & Children)">تأهيل الحوض (للسيدات والأطفال فقط)</option>
                        <option value="traction" data-ar="شد الفقرات المتطور (Spinal Traction)" data-en="Advanced Spinal Traction">شد الفقرات المتطور (Spinal Traction)</option>
                        <option value="laser" data-ar="الليزر العلاجي" data-en="Laser Therapy">الليزر العلاجي</option>
                        <option value="ortho" data-ar="علاج العظام والمفاصل" data-en="Orthopedic & Joint Rehab">علاج العظام والمفاصل</option>
                        <option value="manual" data-ar="العلاج اليدوي" data-en="Manual Therapy">العلاج اليدوي</option>
                        <option value="cupping" data-ar="حجامة وريكافري ومساج" data-en="Cupping, Recovery & Massage">حجامة وريكافري ومساج</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label data-ar="التاريخ المفضل *" data-en="Preferred Date *">التاريخ المفضل *</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label data-ar="الأعراض / ملاحظات" data-en="Symptoms / Notes">الأعراض / ملاحظات</label>
                    <textarea id="notes" rows="4" placeholder="اكتب تفاصيل الأعراض هنا..."></textarea>
                </div>
                
                <button type="submit" class="btn-primary form-submit-btn" data-ar="تأكيد الحجز عبر واتساب" data-en="Confirm via WhatsApp">تأكيد الحجز عبر واتساب</button>
            </form>
        </div>
    </main>

    <!-- Floating WhatsApp Button -->

    <script src="script.js"></script>
</body>
</html>
